name: Mercury weather-feed regressions

on:
  pull_request:
    paths:
      - "engine/**"
      - "app/**"
      - "research/test_fast_weather_feeds.py"
      - "research/test_cross_midnight_sixhr.py"
      - "research/test_tgftp_climate.py"
      - "research/test_climate_hardening.py"
      - "research/test_source_agnostic_bridge.py"
      - "research/test_floor_provenance.py"
      - ".github/workflows/weather-feeds.yml"
  push:
    branches:
      - "feature/tgftp-first-metar-race-20261008"
      - "fix/kden-feed-latency-cli-20261008"
      - "fix/expose-mercury-feed-health-20261008"
      - "fix/mercury-final-guard-oct8"
    paths:
      - "engine/**"
      - "research/test_fast_weather_feeds.py"
      - "research/test_cross_midnight_sixhr.py"
      - ".github/workflows/weather-feeds.yml"

permissions:
  contents: read

jobs:
  weather-feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all feed and runtime modules
        run: python -m compileall -q engine app research/test_fast_weather_feeds.py
      - name: Test fast D-ATIS and TGFTP proofs
        run: python research/test_fast_weather_feeds.py
      - name: Test six-hour cross-midnight safeguard
        run: python research/test_cross_midnight_sixhr.py
      - name: Test official CLI DSM and KDEN source isolation
        run: python research/test_tgftp_climate.py
      - name: Test climate-bulletin freshness, corrected DSM and AWC cooldown
        run: python research/test_climate_hardening.py
      - name: Test signed NWWS ingress and source-agnostic temperature proofs
        run: python research/test_source_agnostic_bridge.py
      - name: Test floor-setting source attribution and preservation
        run: python research/test_floor_provenance.py
